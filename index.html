<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Licence GFTV</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f6f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 90%; 
            max-width: 400px; 
            text-align: center; 
        }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { font-weight: bold; font-size: 13px; color: #444; }
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="card">
    <h2>Abonnement GFTV</h2>
    <p>Saisissez votre numéro Mobile Money pour activer votre licence.</p>
    
    <form action="/payer-flexpay" method="POST">
        <div class="form-group">
            <label>Numéro de téléphone (M-Pesa, Orange, Airtel)</label>
            <input type="text" name="phone" placeholder="Ex: 0812345678" required>
        </div>
        
        <div class="form-group">
            <label>Durée de réactivation</label>
            <select name="duree">
                <option value="30">1 Mois (30 jours)</option>
                <option value="90">3 Mois</option>
                <option value="365">1 An</option>
            </select>
        </div>
        
        <button type="submit">Payer avec FlexPay</button>
    </form>
</div>

</body>
</html>
